# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: kgp
infra:
  provider: bicep
  path: infra
services:
  api:
    project: src/backend/Kgp.Api
    language: dotnet
    host: containerapp
    docker:
      path: ../Dockerfile       # src/backend/Dockerfile
      context: ../../..         # repo root, so the image can include data/peaks.json
  web:
    project: src/frontend
    language: js
    host: staticwebapp
    dist: dist/frontend/browser
    hooks:
      prepackage:
        posix:
          shell: sh
          run: ../../infra/hooks/write-web-config.sh
