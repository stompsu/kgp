name: Deploy

# Needs repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_ENV_NAME, AZURE_LOCATION and AZURE_RESOURCE_GROUP. AZURE_CLIENT_ID is the user-assigned managed
# identity id-kgp-github-dev, whose federated credential trusts
# `repo:stompsu@12047598/kgp@1461006413:environment:dev` (GitHub's ID-based OIDC subject)
# (see docs/architecture.md#ci-deploy). No secrets.
# Optional repository variables for sign-in (docs/auth-setup.md): KGP_AUTH_TENANT_ID,
# KGP_AUTH_TENANT_SUBDOMAIN, KGP_API_CLIENT_ID, KGP_SPA_CLIENT_ID. They are IDs, not secrets.
# Until all four are set, the API and web app run with sign-in off.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency: deploy-${{ github.ref }}

jobs:
  deploy:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      KGP_AUTH_TENANT_ID: ${{ vars.KGP_AUTH_TENANT_ID }}
      KGP_AUTH_TENANT_SUBDOMAIN: ${{ vars.KGP_AUTH_TENANT_SUBDOMAIN }}
      KGP_API_CLIENT_ID: ${{ vars.KGP_API_CLIENT_ID }}
      KGP_SPA_CLIENT_ID: ${{ vars.KGP_SPA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: azd login (OIDC)
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"

      - name: Prepare azd environment
        run: |
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          # Runners start with an empty azd env. Carry over the running API image so provisioning
          # doesn't roll the Container App back to the placeholder before `azd deploy` runs.
          image=$(az containerapp list -g "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.\"azd-service-name\"=='api'] | [0].properties.template.containers[0].image" -o tsv)
          case "$image" in
            *.azurecr.io/*) azd env set SERVICE_API_IMAGE_NAME "$image" ;;
          esac
          # Sign-in settings: read by Bicep (main.parameters.json) and by the web prepackage hook.
          for name in KGP_AUTH_TENANT_ID KGP_AUTH_TENANT_SUBDOMAIN KGP_API_CLIENT_ID KGP_SPA_CLIENT_ID; do
            value=$(printenv "$name" || true)
            if [ -n "$value" ]; then azd env set "$name" "$value"; fi
          done

      - run: azd provision --no-prompt
      - run: azd deploy --no-prompt
