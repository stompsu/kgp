<mat-toolbar class="app-header">
  <h1 class="title">{{ 'app.title' | transloco }}</h1>
  <span class="spacer"></span>
  <button mat-button (click)="toggleLanguage()" [attr.aria-label]="'app.language' | transloco">
    {{ 'app.switchTo' | transloco }}
  </button>
</mat-toolbar>
<main class="app-main">
  <router-outlet />
</main>
<footer class="disclaimer">{{ 'app.disclaimer' | transloco }}</footer>
